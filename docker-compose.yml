services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - uptime-kuma-data:/app/data
    restart: always
    # We don't expose ports here; Caddy handles the public-facing ports.

  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: always
    depends_on:
      - uptime-kuma

volumes:
  uptime-kuma-data:
  caddy-data:
  caddy-config: